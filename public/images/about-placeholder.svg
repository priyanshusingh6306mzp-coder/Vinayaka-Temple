<svg width="800" height="900" viewBox="0 0 800 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="aboutGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#262019" />
      <stop offset="70%" stop-color="#16130F" />
      <stop offset="100%" stop-color="#0E0C09" />
    </radialGradient>
    <filter id="aboutGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Stone Slab -->
  <rect width="800" height="900" rx="12" fill="url(#aboutGrad)" stroke="#B8893B" stroke-width="2" stroke-opacity="0.3" />

  <!-- Inner Sacred Arch (Prabhavali) -->
  <g transform="translate(400, 450)">
    <!-- Aureole Flame Halo -->
    <circle cx="0" cy="-60" r="180" fill="none" stroke="#B8893B" stroke-width="2.5" stroke-opacity="0.5" stroke-dasharray="6 4" />
    <circle cx="0" cy="-60" r="160" fill="none" stroke="#D9A95B" stroke-width="1.5" stroke-opacity="0.3" />

    <!-- Stone Ganapati Silhouette & Yantra Lines -->
    <path d="M-90,120 Q-110,30 -70,-50 Q-30,-110 0,-110 Q30,-110 70,-50 Q110,30 90,120 Z" fill="#120F0C" stroke="#B8893B" stroke-width="2" stroke-opacity="0.4" />

    <!-- Modak / Trishul Crown -->
    <path d="M-15,-110 Q0,-145 15,-110 Z" fill="#D9A95B" filter="url(#aboutGlow)" />
    <!-- Sacred Trunk Motif -->
    <path d="M-10,-20 Q-25,40 10,70 Q25,80 35,65 Q30,50 15,45 Q0,30 0,-20 Z" fill="#B8893B" fill-opacity="0.6" />

    <!-- Sacred Om Sign -->
    <text x="0" y="240" font-family="Georgia, serif" font-size="64" text-anchor="middle" fill="#D9A95B" filter="url(#aboutGlow)">ॐ</text>

    <!-- Lotus Pedestal -->
    <path d="M-160,280 Q-80,240 0,280 Q80,240 160,280 L180,310 L-180,310 Z" fill="#1C1813" stroke="#B8893B" stroke-width="1.5" stroke-opacity="0.5" />
  </g>

  <!-- Notice Tag -->
  <rect x="30" y="30" width="460" height="34" rx="4" fill="#16130F" fill-opacity="0.9" stroke="#B8893B" stroke-width="1" />
  <text x="45" y="52" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#D9A95B">
    [PLACEHOLDER] Black Granite Stone Ganesha Sculpture
  </text>
</svg>
