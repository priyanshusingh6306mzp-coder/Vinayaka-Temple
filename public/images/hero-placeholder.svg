<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2D241C" />
      <stop offset="60%" stop-color="#16130F" />
      <stop offset="100%" stop-color="#0B0907" />
    </radialGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9A95B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#B8893B" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Sacred Atmosphere Background -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />

  <!-- Subtle Stars / Lamp Sparks -->
  <g opacity="0.3">
    <circle cx="300" cy="200" r="1.5" fill="#F6F0E4" />
    <circle cx="500" cy="150" r="2" fill="#F6F0E4" />
    <circle cx="850" cy="120" r="1" fill="#F6F0E4" />
    <circle cx="1100" cy="180" r="1.5" fill="#F6F0E4" />
    <circle cx="1400" cy="140" r="2" fill="#F6F0E4" />
    <circle cx="1650" cy="220" r="1" fill="#F6F0E4" />
  </g>

  <!-- Temple Vimana / Tower Silhouette (Chola Style) -->
  <g transform="translate(960, 520)" text-anchor="middle">
    <!-- Golden Temple Sanctum Halo -->
    <circle cx="0" cy="-60" r="220" fill="#B8893B" opacity="0.08" filter="url(#glow)" />
    <circle cx="0" cy="-60" r="140" fill="#D9A95B" opacity="0.12" filter="url(#glow)" />

    <!-- Chola Temple Shikara Silhouette -->
    <path d="M-220,380 L-180,180 L-130,60 L-80,-60 L-30,-160 L0,-210 L30,-160 L80,-60 L130,60 L180,180 L220,380 Z" fill="#1C1813" stroke="#B8893B" stroke-width="2" stroke-opacity="0.3" />
    <!-- Kalasha / Finial on top -->
    <path d="M-8,-210 Q0,-240 8,-210 Q0,-225 -8,-210 Z" fill="#D9A95B" filter="url(#glow)" />
    <circle cx="0" cy="-245" r="5" fill="#F6F0E4" filter="url(#glow)" />

    <!-- Tiered Dravidian Carvings -->
    <line x1="-160" y1="220" x2="160" y2="220" stroke="#B8893B" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="-120" y1="120" x2="120" y2="120" stroke="#B8893B" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="-80" y1="20" x2="80" y2="20" stroke="#B8893B" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="-50" y1="-80" x2="50" y2="-80" stroke="#B8893B" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Sacred Om Motif in Center of Sanctum -->
    <text x="0" y="-30" font-family="Georgia, serif" font-size="84" fill="#D9A95B" filter="url(#glow)" opacity="0.85">ॐ</text>

    <!-- Deep Stone Plinth -->
    <rect x="-350" y="380" width="700" height="180" fill="#120F0C" stroke="#B8893B" stroke-width="1.5" stroke-opacity="0.25" />
  </g>

  <!-- Brass Diya Lamps on Flanks -->
  <g transform="translate(320, 780)">
    <path d="M-30,40 Q0,70 30,40 Q15,42 0,55 Q-15,42 -30,40 Z" fill="#B8893B" />
    <path d="M0,40 Q-8,15 0,0 Q8,15 0,40 Z" fill="#FFC83B" filter="url(#glow)" />
    <circle cx="0" cy="20" r="3" fill="#FFF7E6" filter="url(#glow)" />
  </g>
  <g transform="translate(1600, 780)">
    <path d="M-30,40 Q0,70 30,40 Q15,42 0,55 Q-15,42 -30,40 Z" fill="#B8893B" />
    <path d="M0,40 Q-8,15 0,0 Q8,15 0,40 Z" fill="#FFC83B" filter="url(#glow)" />
    <circle cx="0" cy="20" r="3" fill="#FFF7E6" filter="url(#glow)" />
  </g>

  <!-- Clear Placeholder Notice Tag (As required by Operating Rule 5) -->
  <rect x="40" y="40" width="480" height="36" rx="6" fill="#16130F" fill-opacity="0.85" stroke="#B8893B" stroke-width="1" />
  <text x="56" y="63" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#D9A95B">
    [PLACEHOLDER] Sanctum Sanctorum &amp; Chola Vimana Artwork
  </text>
</svg>
